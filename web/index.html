<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WAYVE" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="WAYVE turns every phone at your event into a live sensor: meetings, radio and field reports become one live issue tracker." />
    <title>WAYVE</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/pretendard-1.3.9/woff2-dynamic-subset/PretendardVariable.subset.91.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/pretendard-1.3.9/pretendardvariable-dynamic-subset.css" />
    <script>
      (function (d) {
        try {
          var h = d.documentElement, n = navigator;
          var lowMem = n.deviceMemory && n.deviceMemory <= 2;
          var noBlur = !(window.CSS && CSS.supports && (CSS.supports('backdrop-filter: blur(1px)') || CSS.supports('-webkit-backdrop-filter: blur(1px)')));
          if (lowMem || noBlur) h.classList.add('lg-lite');
        } catch (e) {}
      })(document);
    </script>
  </head>

    <div id="root"></div>
    <noscript>WAYVE needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
